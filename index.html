<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070d" />
    <script>
      // Apply the saved (or system) theme before first paint so there is no flash
      (function () {
        try {
          var s = localStorage.getItem('vp-theme');
          var light = s ? s === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
          var c = document.documentElement.classList;
          c.toggle('light', light);
          c.toggle('dark', !light);
        } catch (e) {}
      })();
    </script>
    <title>Veer Patwa | Backend Engineer</title>
    <meta name="description" content="Veer Patwa is a backend engineer working with Java, Spring Boot, microservices and Couchbase, and the builder of Inventra, an offline-first multi-tenant platform." />
    <meta name="author" content="Veer Patwa" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Veer Patwa | Backend Engineer" />
    <meta property="og:description" content="Java microservices at scale, and an offline-first platform built end to end." />
    <meta name="twitter:card" content="summary" />
